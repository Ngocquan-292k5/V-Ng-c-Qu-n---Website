<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Blog Cá Nhân</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      padding: 30px 20px;
      background: var(--bg-dark);
      min-height: 100vh;
      color: var(--text-light);
      font-family: 'Segoe UI', Arial, sans-serif;
    }

    h1 {
      text-align: center;
      color: var(--primary-light);
      margin-bottom: 2rem;
      text-shadow: 0 0 10px rgba(45, 212, 191, 0.3);
    }

    .form-section {
      max-width: 900px;
      margin: 0 auto 3rem;
      background: var(--bg-medium);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(13, 148, 136, 0.2);
    }

    input[type="text"], textarea {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid var(--primary);
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      color: white;
      font-size: 1rem;
    }

    textarea { min-height: 140px; resize: vertical; }

    .file-input-wrapper {
      margin: 15px 0;
      display: flex;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    label.file-label {
      cursor: pointer;
      font-size: 1.6rem;
      color: var(--accent);
      transition: all 0.3s;
    }

    label.file-label:hover {
      color: var(--primary-light);
      transform: scale(1.1);
    }

    input[type="file"] { display: none; }

    .media-preview {
      font-size: 1.1rem;
      color: var(--text-muted);
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    button {
      padding: 12px 28px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    button:hover {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(45, 212, 191, 0.4);
    }

    .posts-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .post {
      background: var(--bg-medium);
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 2.5rem;
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
      border-left: 6px solid var(--accent);
      transition: all 0.3s ease;
    }

    .post:hover {
      transform: translateY(-6px);
      box-shadow: 0 15px 35px rgba(13, 148, 136, 0.4);
    }

    .post h3 {
      margin: 0 0 12px;
      color: var(--primary-light);
    }

    .post .date {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .post .content {
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .post-media, .comment-media {
      max-width: 100%;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      margin: 15px 0;
      display: block;
    }

    .post-media-label {
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 8px;
      display: block;
    }

    .post-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 15px;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid rgba(13, 148, 136, 0.2);
    }

    .action-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: color 0.3s;
    }

    .action-btn:hover {
      color: var(--accent);
    }

    .like-btn.liked {
      color: #ef4444;
    }

    .delete-btn {
      color: var(--danger);
    }

    .delete-btn:hover {
      color: #ef4444dd;
    }

    .comments {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid rgba(13, 148, 136, 0.2);
    }

    .comment {
      margin: 15px 0;
      padding: 15px;
      background: rgba(0,0,0,0.35);
      border-radius: 10px;
      border-left: 4px solid var(--accent);
    }

    .comment .name {
      color: var(--accent);
      font-weight: bold;
      margin-right: 10px;
    }

    .comment-form {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .no-posts {
      text-align: center;
      color: var(--text-muted);
      font-size: 1.3rem;
      padding: 50px 20px;
      background: var(--bg-medium);
      border-radius: 12px;
    }

    @media (max-width: 768px) {
      .form-section, .posts-container { padding: 20px 15px; }
      .file-input-wrapper { flex-direction: column; align-items: flex-start; }
      .post-actions { gap: 10px; }
    }
  </style>
</head>
<body>

<h1>Blog Cá Nhân</h1>

<div class="form-section">
  <input type="text" id="title" placeholder="Tiêu đề bài viết..." />
  <textarea id="content" placeholder="Viết suy nghĩ, chia sẻ kiến thức..."></textarea>
  
  <div class="file-input-wrapper">
    <label for="postMedia" class="file-label">📷 Thêm ảnh / 🎥 Video</label>
    <input type="file" id="postMedia" accept="image/*,video/*" />
    <div id="postMediaPreview" class="media-preview"></div>
  </div>
  
  <button onclick="addPost()">Đăng bài</button>
</div>

<div class="posts-container" id="posts"></div>

<script>
let posts = JSON.parse(localStorage.getItem("myBlog")) || [];

function renderPosts() {
  const container = document.getElementById("posts");
  container.innerHTML = "";

  if (posts.length === 0) {
    container.innerHTML = '<div class="no-posts">Chưa có bài viết nào. Hãy là người đầu tiên chia sẻ!</div>';
    return;
  }

  posts.forEach((post, i) => {
    const postDiv = document.createElement("div");
    postDiv.className = "post";

    let mediaHTML = '';
    if (post.media) {
      if (post.media.type.startsWith('image')) {
        mediaHTML = `
          <img class="post-media" src="${post.media.base64}" alt="${post.media.name}">
          <span class="post-media-label">📸 Ảnh đính kèm</span>
        `;
      } else if (post.media.type.startsWith('video')) {
        mediaHTML = `
          <video class="post-media" controls src="${post.media.base64}"></video>
          <span class="post-media-label">🎬 Video đính kèm</span>
        `;
      }
    }

    let html = `
      <h3>${post.title}</h3>
      <div class="date">${post.date}</div>
      <div class="content">${post.content.replace(/\n/g, "<br>")}</div>
      ${mediaHTML}
      
      <div class="post-actions">
        <button class="action-btn like-btn ${post.liked ? 'liked' : ''}" onclick="likePost(${i})">
          ❤️ ${post.likes || 0}
        </button>
        <button class="action-btn share-btn" onclick="sharePost(${i})">
          🔗 Share
        </button>
        <button class="action-btn delete-btn" onclick="deletePost(${i})">
          🗑️ Xóa bài viết
        </button>
      </div>
      
      <div class="comments">
        <h4>Bình luận (${post.comments.length})</h4>
    `;

    post.comments.forEach(c => {
      let cMedia = '';
      if (c.media) {
        if (c.media.type.startsWith('image')) {
          cMedia = `
            <img class="comment-media" src="${c.media.base64}" alt="${c.media.name}">
            <span class="post-media-label">📸 Ảnh</span>
          `;
        } else if (c.media.type.startsWith('video')) {
          cMedia = `
            <video class="comment-media" controls src="${c.media.base64}"></video>
            <span class="post-media-label">🎬 Video</span>
          `;
        }
      }

      html += `
        <div class="comment">
          <span class="name">${c.name || "Khách"}</span>
          <span>${c.text}</span>
          ${cMedia}
        </div>
      `;
    });

    html += `
      </div>
      <div class="comment-form">
        <input type="text" id="name${i}" placeholder="Tên bạn (hoặc để trống)" />
        <textarea id="comm${i}" placeholder="Viết bình luận..."></textarea>
        
        <div class="file-input-wrapper">
          <label for="commMedia${i}" class="file-label">📷 Thêm ảnh / 🎥 Video</label>
          <input type="file" id="commMedia${i}" accept="image/*,video/*" />
          <div id="commMediaPreview${i}" class="media-preview"></div>
        </div>
        
        <button onclick="addComment(${i})">Gửi bình luận</button>
      </div>
    `;

    postDiv.innerHTML = html;
    container.appendChild(postDiv);
  });
}

async function addPost() {
  const title = document.getElementById("title").value.trim();
  const content = document.getElementById("content").value.trim();
  const mediaInput = document.getElementById("postMedia");

  if (!title || !content) {
    alert("Vui lòng nhập tiêu đề và nội dung!");
    return;
  }

  let mediaData = null;
  if (mediaInput.files[0]) {
    mediaData = await fileToBase64(mediaInput.files[0]);
  }

  posts.unshift({
    title,
    content,
    date: new Date().toLocaleString("vi-VN", { dateStyle: "full", timeStyle: "short" }),
    media: mediaData ? { name: mediaInput.files[0].name, type: mediaInput.files[0].type, base64: mediaData } : null,
    comments: [],
    likes: 0,
    liked: false
  });

  localStorage.setItem("myBlog", JSON.stringify(posts));
  renderPosts();

  document.getElementById("title").value = "";
  document.getElementById("content").value = "";
  mediaInput.value = "";
  document.getElementById("postMediaPreview").innerHTML = "";
}

async function addComment(idx) {
  const nameInput = document.getElementById(`name${idx}`);
  const commInput = document.getElementById(`comm${idx}`);
  const mediaInput = document.getElementById(`commMedia${idx}`);

  const name = nameInput.value.trim() || "Khách";
  const text = commInput.value.trim();

  if (!text) {
    alert("Vui lòng viết nội dung bình luận!");
    return;
  }

  let mediaData = null;
  if (mediaInput.files[0]) {
    mediaData = await fileToBase64(mediaInput.files[0]);
  }

  posts[idx].comments.push({
    name,
    text,
    media: mediaData ? { name: mediaInput.files[0].name, type: mediaInput.files[0].type, base64: mediaData } : null
  });

  localStorage.setItem("myBlog", JSON.stringify(posts));
  renderPosts();

  nameInput.value = "";
  commInput.value = "";
  mediaInput.value = "";
  document.getElementById(`commMediaPreview${idx}`).innerHTML = "";
}

function likePost(idx) {
  posts[idx].liked = !posts[idx].liked;
  posts[idx].likes += posts[idx].liked ? 1 : -1;
  localStorage.setItem("myBlog", JSON.stringify(posts));
  renderPosts();
}

function sharePost(idx) {
  const post = posts[idx];
  const shareText = `Tiêu đề: ${post.title}\nNội dung: ${post.content}\nNgày: ${post.date}`;
  navigator.clipboard.writeText(shareText).then(() => {
    alert("Nội dung bài viết đã copy vào clipboard! Bạn có thể paste để chia sẻ.");
  }).catch(() => {
    alert("Không copy được, vui lòng copy thủ công:\n\n" + shareText);
  });
}

function deletePost(idx) {
  if (confirm("Bạn có chắc muốn xóa bài viết này? Hành động không thể khôi phục!")) {
    posts.splice(idx, 1);
    localStorage.setItem("myBlog", JSON.stringify(posts));
    renderPosts();
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result);
    reader.onerror = error => reject(error);
  });
}

// Preview khi chọn file cho bài viết
document.getElementById("postMedia").onchange = function(e) {
  const file = e.target.files[0];
  const preview = document.getElementById("postMediaPreview");
  if (file) {
    if (file.type.startsWith("image")) preview.innerHTML = "📸 " + file.name;
    else if (file.type.startsWith("video")) preview.innerHTML = "🎬 " + file.name;
  } else {
    preview.innerHTML = "";
  }
};

// Preview động cho bình luận
document.addEventListener("change", function(e) {
  if (e.target.type === "file" && e.target.id.startsWith("commMedia")) {
    const file = e.target.files[0];
    const index = e.target.id.replace("commMedia", "");
    const preview = document.getElementById(`commMediaPreview${index}`);
    if (file) {
      if (file.type.startsWith("image")) preview.innerHTML = "📸 Ảnh đã chọn";
      else if (file.type.startsWith("video")) preview.innerHTML = "🎬 Video đã chọn";
    } else {
      preview.innerHTML = "";
    }
  }
});

// Load khi mở trang
renderPosts();
</script>

<br style="clear:both">
<a href="index.html" style="display:block; text-align:center; margin:40px 0; color:var(--accent); font-weight:bold; font-size:1.2rem;">← Về trang chủ</a>

</body>
</html>
